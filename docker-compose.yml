name: city-gap-platform

services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0@sha256:bd277edf6e855db49837314209b0eb8902e8f0fa6f9d6ac6952f7355fdb24465
    environment:
      POSTGRES_DB: ${CITYGAP_POSTGRES_DB:-citygap}
      POSTGRES_USER: ${CITYGAP_POSTGRES_USER:-citygap}
      POSTGRES_PASSWORD: ${CITYGAP_POSTGRES_PASSWORD:-citygap_dev}
    ports:
      - "${CITYGAP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - citygap_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "backend.citygap_platform.database.migrations", "upgrade"]
    environment:
      CITYGAP_DATABASE_URL: postgresql://${CITYGAP_POSTGRES_USER:-citygap}:${CITYGAP_POSTGRES_PASSWORD:-citygap_dev}@postgres:5432/${CITYGAP_POSTGRES_DB:-citygap}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      CITYGAP_DATABASE_URL: postgresql://${CITYGAP_POSTGRES_USER:-citygap}:${CITYGAP_POSTGRES_PASSWORD:-citygap_dev}@postgres:5432/${CITYGAP_POSTGRES_DB:-citygap}
      CITYGAP_ENVIRONMENT: ${CITYGAP_ENVIRONMENT:-development}
      CITYGAP_AUTH_MODE: ${CITYGAP_AUTH_MODE:-development}
      CITYGAP_API_SURFACE: ${CITYGAP_API_SURFACE:-municipal}
      CITYGAP_REQUIRED_CITY_ID: ${CITYGAP_REQUIRED_CITY_ID:-}
      CITYGAP_OIDC_ISSUER: ${CITYGAP_OIDC_ISSUER:-}
      CITYGAP_OIDC_AUDIENCE: ${CITYGAP_OIDC_AUDIENCE:-}
      CITYGAP_OIDC_VERIFIER_CONFIGURED: ${CITYGAP_OIDC_VERIFIER_CONFIGURED:-false}
      CITYGAP_BACKUP_DIRECTORY: ${CITYGAP_BACKUP_DIRECTORY:-}
      CITYGAP_BACKUP_COMMAND_VERIFIED: ${CITYGAP_BACKUP_COMMAND_VERIFIED:-false}
      CITYGAP_TILE_CACHE_ITEMS: ${CITYGAP_TILE_CACHE_ITEMS:-512}
      CITYGAP_ATTACHMENT_PROVIDER: ${CITYGAP_ATTACHMENT_PROVIDER:-local}
      CITYGAP_ATTACHMENT_DIRECTORY: ${CITYGAP_ATTACHMENT_DIRECTORY:-/app/var/attachments}
    ports:
      - "${CITYGAP_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - citygap_artifacts:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "backend.citygap_platform.worker"]
    environment:
      CITYGAP_DATABASE_URL: postgresql://${CITYGAP_POSTGRES_USER:-citygap}:${CITYGAP_POSTGRES_PASSWORD:-citygap_dev}@postgres:5432/${CITYGAP_POSTGRES_DB:-citygap}
      CITYGAP_WORKER_ID: ${CITYGAP_WORKER_ID:-compose-worker}
      CITYGAP_JOB_STAGE_TIMEOUT_SECONDS: ${CITYGAP_JOB_STAGE_TIMEOUT_SECONDS:-3600}
      CITYGAP_JOB_STALE_AFTER_SECONDS: ${CITYGAP_JOB_STALE_AFTER_SECONDS:-3900}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - citygap_artifacts:/app/var
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_CITYGAP_SURFACE: ${VITE_CITYGAP_SURFACE:-municipal}
        VITE_CITYGAP_API_BASE_URL: ${VITE_CITYGAP_API_BASE_URL:-}
    ports:
      - "${CITYGAP_FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  citygap_postgres:
  citygap_artifacts:
