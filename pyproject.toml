[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "city-gap-analysis"
version = "0.1.0"
description = "Reproducible spatial gap analysis for Maizuru City"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=0.14,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyogrio>=0.7,<1",
  "pyproj>=3.6,<4",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

