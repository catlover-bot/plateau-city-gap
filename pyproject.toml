[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "city-gap-analysis"
version = "0.1.0"
description = "Reproducible, city-independent spatial gap analysis"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=0.14,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=23.0.1,<24",
  "pyogrio>=0.7,<1",
  "pyproj>=3.6,<4",
  "pyyaml>=6,<7",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
platform = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]
dev = ["httpx>=0.27,<1", "pytest>=9.0.3,<10", "ruff>=0.6,<1"]

[project.scripts]
citygap = "backend.citygap_platform.cli:main"

[tool.setuptools.packages.find]
include = ["analysis*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests", "backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
