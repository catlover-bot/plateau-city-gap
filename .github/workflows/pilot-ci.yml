name: Municipal Pilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[platform,dev]"
      - run: ruff check analysis backend
      - run: pytest analysis/tests backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[platform,dev]" pip-audit
      - run: pip-audit --skip-editable
      - name: Reject tracked secrets and raw municipal data
        run: |
          ! git grep -En '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})'
          test -z "$(git ls-files data/raw ':!data/raw/.gitkeep')"

  public-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[platform,dev]"
      - run: pytest backend/tests/test_real_inventory_artifact.py analysis/tests/test_web_assets.py analysis/tests/test_municipal_workspace_assets.py -q
      - run: python -m analysis.scripts.audit_urban_futures_platform
      - run: python -m analysis.scripts.audit_open_data_platform

  validation-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[platform,dev]"
      - name: validation-unit and cross-model-contract
        run: >-
          pytest analysis/tests/test_model_validation.py
          analysis/tests/test_sensitivity_validation.py
          analysis/tests/test_temporal_validation.py
          backend/tests/test_validation_domain.py
          backend/tests/test_validation_api.py -q
      - name: chaos and failure recovery
        run: pytest backend/tests/test_validation_chaos.py -q
      - name: privacy-leak
        run: pytest backend/tests/test_public_validation_privacy.py -q
      - name: PLATEAU-native browser, accessibility and strict 3D readiness
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          ./node_modules/.bin/playwright-core install --with-deps chromium
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/citygap-validation-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill ${preview_pid}' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/plateau-city-gap/ >/dev/null; then break; fi
            sleep 1
          done
          npm run audit:plateau-native -- --output /tmp/plateau-native-browser-audit.json
          npm run capture:current -- --output /tmp/citygap-current-capture --diagnostics /tmp/citygap-readiness-failures --only 02-resolution-lift
      - name: pilot-rehearsal and Evidence integrity
        run: |
          python -m analysis.scripts.run_validation_pilot_rehearsal
          python -m analysis.scripts.build_validation_evidence_package
          pytest backend/tests/test_validation_artifacts.py -q

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgrouting/pgrouting:16-3.5-4.0@sha256:bd277edf6e855db49837314209b0eb8902e8f0fa6f9d6ac6952f7355fdb24465
        env:
          POSTGRES_DB: citygap
          POSTGRES_USER: citygap
          POSTGRES_PASSWORD: citygap_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citygap -d citygap"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CITYGAP_DATABASE_URL: postgresql://citygap:citygap_ci@127.0.0.1:5432/citygap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[platform]"
      - name: Apply and verify every checksummed migration
        run: |
          python -m backend.citygap_platform.database.migrations upgrade
          python -m backend.citygap_platform.database.migrations status
      - name: Verify spatial extensions execute
        run: python -c "import os, psycopg; c=psycopg.connect(os.environ['CITYGAP_DATABASE_URL']); assert c.execute('SELECT PostGIS_Version() IS NOT NULL, pgr_version() IS NOT NULL').fetchone() == (True, True)"

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgrouting/pgrouting:16-3.5-4.0@sha256:bd277edf6e855db49837314209b0eb8902e8f0fa6f9d6ac6952f7355fdb24465
        env:
          POSTGRES_DB: citygap
          POSTGRES_USER: citygap
          POSTGRES_PASSWORD: citygap_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citygap -d citygap"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CITYGAP_DATABASE_URL: postgresql://citygap:citygap_ci@127.0.0.1:5432/citygap
      CITYGAP_TEST_DATABASE_URL: postgresql://citygap:citygap_ci@127.0.0.1:5432/citygap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[platform,dev]"
      - run: python -m analysis.scripts.build_scenario_canonical >/tmp/scenario-manifest.json
      - name: Exercise database-backed API, spatial query, MVT and open-data tenant gates
        run: >-
          pytest
          backend/integration/test_postgis_platform.py::test_real_canonical_scenarios_spatial_api_and_comparison
          backend/integration/test_postgis_platform.py::test_temporal_resilience_and_offline_field_postgis_contract
          backend/integration/test_municipal_service.py::test_role_based_finding_to_human_decision_acceptance
          backend/integration/test_municipal_service.py::test_data_hub_v2_exposes_coverage_lineage_without_automatic_truth_selection
          backend/integration/test_municipal_service.py::test_open_data_operator_workflows_are_explicit_versioned_and_tenant_scoped
          backend/integration/test_municipal_service.py::test_public_raw_blob_dedup_keeps_tenant_source_metadata_separate
          backend/integration/test_municipal_service.py::test_feedback_override_evidence_report_and_transparency_review_loop
          backend/integration/test_municipal_service.py::test_organization_a_b_isolation_for_api_and_database_constraints
          -q
      - name: Start API and verify health plus database readiness
        run: |
          uvicorn backend.citygap_platform.api.app:app --host 127.0.0.1 --port 8000 > /tmp/citygap-api.log 2>&1 &
          api_pid=$!
          trap 'kill ${api_pid}' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/tmp/ready.json; then break; fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("/tmp/ready.json")); assert data["ready"] is True'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build API/worker and frontend images
        run: |
          docker build --file infra/docker/api.Dockerfile --tag citygap-api:ci .
          docker build --file infra/docker/frontend.Dockerfile --tag citygap-frontend:ci .

  postgis-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgrouting/pgrouting:16-3.5-4.0@sha256:bd277edf6e855db49837314209b0eb8902e8f0fa6f9d6ac6952f7355fdb24465
        env:
          POSTGRES_DB: citygap
          POSTGRES_USER: citygap
          POSTGRES_PASSWORD: citygap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citygap -d citygap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CITYGAP_DATABASE_URL: postgresql://citygap:citygap_ci@127.0.0.1:5432/citygap
      CITYGAP_TEST_DATABASE_URL: postgresql://citygap:citygap_ci@127.0.0.1:5432/citygap
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: citygap
      PGPASSWORD: citygap_ci
      CITYGAP_SOURCE_DATABASE: citygap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[platform,dev]"
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Regenerate real-analysis-derived canonical scenario tables
        run: python -m analysis.scripts.build_scenario_canonical >/tmp/scenario-manifest.json
      - name: Apply all migrations through checksum runner
        run: python -m backend.citygap_platform.database.migrations upgrade
      - name: Exercise real PostGIS, pgRouting, loader, API and transactions
        run: pytest backend/integration -q
      - name: Benchmark 100k buildings and 100k road edges
        run: python -m analysis.scripts.benchmark_pilot_api --output /tmp/pilot-performance.json
      - name: Start the real database-backed API process
        run: |
          uvicorn backend.citygap_platform.api.app:app --host 127.0.0.1 --port 8000 > /tmp/citygap-api.log 2>&1 &
          api_pid=$!
          trap 'kill ${api_pid}' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("/tmp/health.json")); assert data == {"status": "ok"}'
      - name: Verify pg_dump and pg_restore
        run: bash infra/scripts/verify_backup_restore.sh
      - name: Publish PostGIS diagnostics
        if: always()
        run: |
          psql --dbname=citygap --command="SELECT extname, extversion FROM pg_extension WHERE extname IN ('postgis','pgrouting')" || true
          psql --dbname=citygap --command="SELECT version, applied_at FROM schema_migrations ORDER BY version" || true
      - name: Publish performance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pilot-performance
          path: /tmp/pilot-performance.json
          if-no-files-found: warn
